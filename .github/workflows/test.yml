name: Test Windows & Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 22

jobs:
  linux:
    name: Linux (clang ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${LLVM_VERSION}

      - name: Install tools
        run: |
          sudo apt-get install -y ninja-build libgtest-dev
          pipx install cmake

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTARE_BUILD_TESTS=ON
          -DTARE_BUILD_DOCS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (clang ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install tools
        run: |
          choco upgrade llvm -y --no-progress
          choco install ninja -y --no-progress
          pipx install cmake

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTARE_BUILD_TESTS=ON
          -DTARE_BUILD_DOCS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure